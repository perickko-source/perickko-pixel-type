<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PIXELMASTER · Entre Píxeles Anda el Juego</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#070a14; }
  body { position:fixed; inset:0; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  canvas { display:block; width:100vw; height:100vh; height:100dvh; image-rendering:pixelated; image-rendering:crisp-edges; cursor:crosshair; }
  #btnSound { position:fixed; top:10px; right:10px; z-index:30; display:flex; align-items:center; gap:7px;
    font:bold 11px monospace; letter-spacing:1px; color:#fff; background:#161c36; border:2px solid #263052;
    padding:9px 11px; cursor:pointer; }
  #btnSound .led { width:9px; height:9px; background:#3ddc55; box-shadow:0 0 7px #3ddc55; }
  #btnSound.off { color:#8b93a8; }
  #btnSound.off .led { background:#5a6178; box-shadow:none; }
  #btnSound:hover { border-color:#35e0e8; }
  /* PC: controles clásicos */
  #touchControls { position:fixed; right:18px; bottom:18px; display:none; gap:12px; z-index:10; }
  #touchControls button { width:72px; height:72px; border-radius:50%; border:2px solid rgba(255,255,255,.55); color:#fff; font:bold 20px monospace; touch-action:none; -webkit-tap-highlight-color:transparent; }
  #btnFire { background:rgba(232,40,60,.6); }
  #btnBomb { background:rgba(255,140,26,.6); }
  #btnForce { background:rgba(47,157,240,.6); font-size:16px; }
  #touchControls button:active { filter:brightness(1.5); }
  
  /* ═══════ SKIN CONSOLA PORTÁTIL (solo móvil) ═══════ */
  #skinContainer {
    display:none;
    position:fixed; inset:0; z-index:5;
    background-image:url('skin2.png');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
  }
  /* Área de la pantalla dentro de la skin (ajustar según tu imagen) */
  #screenArea {
    position:absolute;
    left:15%; right:15%; top:6%; bottom:22%;
    overflow:hidden;
    border-radius:4px;
  }
  #screenArea canvas {
    width:100% !important;
    height:100% !important;
    display:block;
  }
  /* Joystick sobre el analógico izquierdo */
  #skinJoystick {
    position:absolute;
    left:6%; bottom:14%;
    width:18%; aspect-ratio:1;
    max-width:140px; max-height:140px;
    z-index:20;
  }
  #skinJoystickBase {
    position:absolute; inset:0;
    border-radius:50%;
    background:rgba(255,255,255,0.06);
    border:2px solid rgba(255,255,255,0.15);
  }
  #skinJoystickThumb {
    position:absolute;
    width:45%; height:45%;
    border-radius:50%;
    background:rgba(255,255,255,0.18);
    border:2px solid rgba(255,255,255,0.4);
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    pointer-events:none;
  }
  /* Botones de acción sobre los físicos (Y,X,B,A) */
  #skinButtons {
    position:absolute;
    right:5%; bottom:14%;
    width:22%; aspect-ratio:1;
    max-width:170px; max-height:170px;
    z-index:20;
  }
  .skinBtn {
    position:absolute;
    width:38%; height:38%;
    border-radius:50%;
    background:rgba(255,255,255,0.10);
    border:2px solid rgba(255,255,255,0.35);
    color:#fff;
    font:bold 18px monospace;
    display:flex; align-items:center; justify-content:center;
    touch-action:none;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  .skinBtn:active { background:rgba(255,255,255,0.28); transform:scale(0.92); }
  /* Posiciones en cruz: Y arriba, X izquierda, B derecha, A abajo */
  #skinBtnY { top:0; left:50%; transform:translateX(-50%); }
  #skinBtnX { top:50%; left:0; transform:translateY(-50%); }
  #skinBtnB { top:50%; right:0; transform:translateY(-50%); }
  #skinBtnA { bottom:0; left:50%; transform:translateX(-50%); }
  #skinBtnY:active { transform:translateX(-50%) scale(0.92); }
  #skinBtnX:active { transform:translateY(-50%) scale(0.92); }
  #skinBtnB:active { transform:translateY(-50%) scale(0.92); }
  #skinBtnA:active { transform:translateX(-50%) scale(0.92); }
  
  /* Etiquetas de función debajo de cada botón */
  .skinBtnLabel {
    position:absolute;
    font:bold 9px monospace;
    color:rgba(255,255,255,0.5);
    text-align:center;
    width:100%;
    bottom:-14px;
    left:0;
    letter-spacing:1px;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="btnSound" aria-label="Silenciar o activar sonido"><span class="led"></span><span id="sndLabel">SONIDO</span></button>

<!-- PC: controles clásicos -->
<div id="touchControls">
  <button id="btnFire" aria-label="Disparar">Z</button>
  <button id="btnBomb" aria-label="Lanzar bomba">X</button>
  <button id="btnForce" aria-label="Nave nodriza">C</button>
</div>

<!-- MÓVIL: skin consola -->
<div id="skinContainer">
  <div id="screenArea"></div>
  <div id="skinJoystick">
    <div id="skinJoystickBase"></div>
    <div id="skinJoystickThumb"></div>
  </div>
  <div id="skinButtons">
    <div class="skinBtn" id="skinBtnY">Y<span class="skinBtnLabel">—</span></div>
    <div class="skinBtn" id="skinBtnX">X<span class="skinBtnLabel">FORCE</span></div>
    <div class="skinBtn" id="skinBtnB">B<span class="skinBtnLabel">BOMBA</span></div>
    <div class="skinBtn" id="skinBtnA">A<span class="skinBtnLabel">DISPARO</span></div>
  </div>
</div>

<script>
'use strict';
/* ════════════════════════════════════════════════
   PIXELMASTER · Skin consola portátil en móvil
   - Pantalla: área central de skin2.png
   - Joystick: sobre analógico izquierdo
   - A=Disparo(Z) · B=Bomba(X) · X=Force(C) · Y=libre
   ════════════════════════════════════════════════ */
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
function rect(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)));}
function ovalD(g,cx,cy,rx,ry,c){for(var y=-ry;y<=ry;y++){var w=Math.round(rx*Math.sqrt(Math.max(0,1-(y/ry)*(y/ry))));rect(g,cx-w,cy+y,w*2+1,1,c);}}
function mk(g,cx,cy,s){return function(a,b,w,h,c){rect(g,cx+a*s,cy+b*s,w*s,h*s,c);};}
function circleRect(cx,cy,r,rx,ry,rw,rh){const nx=clamp(cx,rx,rx+rw),ny=clamp(cy,ry,ry+rh);const dx=cx-nx,dy=cy-ny;return dx*dx+dy*dy<=r*r;}

/* ═══════ AUDIO ═══════ */
const MUS_BASS=[33,0,0,0,33,0,31,0,33,0,0,0,29,0,31,0,36,0,0,0,36,0,34,0,33,0,0,0,31,0,29,0];
const MUS_LEAD=[0,0,57,0,60,0,57,0,64,0,60,0,57,0,55,0,0,0,57,0,60,0,64,0,67,0,64,0,60,0,55,0];
function midi(m){return 440*Math.pow(2,(m-69)/12);}
const AudioSys={
  ctx:null,master:null,sfxG:null,musG:null,noiseBuf:null,muted:false,ready:false,bossMode:false,
  music:false,
  _step:0,_next:0,_timer:null,
  init(){
    if(this.ctx)return;
    const C=window.AudioContext||window.webkitAudioContext; if(!C)return;
    this.ctx=new C();
    this.master=this.ctx.createGain(); this.master.gain.value=this.muted?0:0.85; this.master.connect(this.ctx.destination);
    this.sfxG=this.ctx.createGain(); this.sfxG.gain.value=0.9; this.sfxG.connect(this.master);
    this.musG=this.ctx.createGain(); this.musG.gain.value=0.30; this.musG.connect(this.master);
    const len=Math.floor(this.ctx.sampleRate*1); const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
    const d=buf.getChannelData(0); for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    this.noiseBuf=buf; this.ready=true;
    this._next=this.ctx.currentTime+0.15; this._step=0;
    this._timer=setInterval(()=>this._schedule(),60);
  },
  now(){return this.ctx?this.ctx.currentTime:0;},
  resume(){ if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume(); },
  setMuted(m){ this.muted=m; if(this.ctx&&this.master)this.master.gain.setTargetAtTime(m?0:0.85,this.now(),0.02); syncSoundBtn(); },
  tone(f,dur,type,vol,slide,when,dest){
    if(!this.ready)return; const t=when||this.now();
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+dur);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.005); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(dest||this.sfxG); o.start(t); o.stop(t+dur+0.02);
  },
  noise(dur,vol,freq,q,when,dest){
    if(!this.ready)return; const t=when||this.now();
    const s=this.ctx.createBufferSource(); s.buffer=this.noiseBuf; s.loop=true;
    const f=this.ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq||1000; f.Q.value=q||0.8;
    const g=this.ctx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(dest||this.sfxG); s.start(t); s.stop(t+dur+0.02);
  },
  shoot(){ this.tone(880,0.08,'square',0.16,240); },
  bomb(){ this.tone(170,0.25,'sawtooth',0.24,60); this.noise(0.18,0.18,500,0.8); },
  explode(big){ if(big){ this.noise(0.5,0.5,180,0.5); this.tone(80,0.5,'sine',0.45,30); }
    else { this.noise(0.22,0.3,600,0.9); this.tone(150,0.18,'triangle',0.22,60); } },
  hit(){ this.tone(320,0.04,'square',0.07,220); },
  cancel(){ this.tone(1200,0.06,'square',0.11,1800); },
  coin(){ const t=this.now(); this.tone(988,0.06,'square',0.12,null,t); this.tone(1319,0.12,'square',0.12,null,t+0.06); },
  hurt(){ this.noise(0.4,0.5,300,0.5); this.tone(220,0.4,'sawtooth',0.3,60); },
  gameover(){ const t=this.now(); [440,349,294,220].forEach((f,i)=>this.tone(f,0.3,'triangle',0.25,null,t+i*0.18)); },
  warn(){ const t=this.now(); for(let i=0;i<3;i++){ this.tone(660,0.14,'square',0.2,880,t+i*0.26); this.tone(880,0.14,'square',0.2,660,t+i*0.26+0.13); } },
  bosshit(){ this.tone(210,0.05,'square',0.09,150); },
  bossdie(){ const t=this.now(); this.noise(1.0,0.6,150,0.5); this.tone(60,0.9,'sine',0.5,30,t);
    [523,659,784,1046].forEach((f,i)=>this.tone(f,0.2,'square',0.2,null,t+0.35+i*0.12)); },
  bonus(){ const t=this.now(); [523,659,784].forEach((f,i)=>this.tone(f,0.12,'square',0.2,null,t+i*0.09)); },
  life(){ const t=this.now(); [392,523,659,784,1046].forEach((f,i)=>this.tone(f,0.12,'triangle',0.22,null,t+i*0.08)); },
  laserCharge(){ this.tone(180,0.9,'sawtooth',0.16,980); },
  laserFire(){ const t=this.now(); this.tone(1300,1.4,'sawtooth',0.2,260,t); this.noise(1.4,0.22,2600,0.6,t); },
  forceDeploy(){ const t=this.now(); this.tone(440,0.12,'square',0.18,null,t); this.tone(660,0.12,'square',0.18,null,t+0.08); this.tone(880,0.15,'square',0.18,null,t+0.16); },
  forceRecall(){ const t=this.now(); this.tone(880,0.12,'square',0.18,440,t); },
  _spb(){ const bpm=this.bossMode?150:128; return (60/bpm)/4; },
  _schedule(){
    if(!this.ready)return;
    if(!this.music){ this._next=this.ctx.currentTime+0.15; return; }
    while(this._next<this.ctx.currentTime+0.12){ this._playStep(this._step,this._next); this._step=(this._step+1)%32; this._next+=this._spb(); }
  },
  _playStep(s,t){
    const b=MUS_BASS[s]; if(b)this.tone(midi(b),0.18,'square',0.22,null,t,this.musG);
    const l=MUS_LEAD[s]; if(l)this.tone(midi(l),0.14,'square',0.09,null,t,this.musG);
    if(s%4===2)this.noise(0.03,0.05,6000,1,t,this.musG);
    if(s%8===0)this.tone(midi(21),0.1,'sine',0.3,null,t,this.musG);
    if(this.bossMode&&s%4===0)this.noise(0.05,0.08,2000,1,t,this.musG);
  }
};
const btnSound=document.getElementById('btnSound'),sndLabel=document.getElementById('sndLabel');
function syncSoundBtn(){ sndLabel.textContent=AudioSys.muted?'SILENCIO':'SONIDO'; btnSound.classList.toggle('off',AudioSys.muted); }
btnSound.addEventListener('click',()=>{ AudioSys.init(); AudioSys.resume(); AudioSys.setMuted(!AudioSys.muted); });
syncSoundBtn();
document.addEventListener('visibilitychange',()=>{ if(!AudioSys.ctx)return; if(document.hidden)AudioSys.ctx.suspend(); else AudioSys.resume(); });

let W=0,H=0,bgGrad=null,shake=0,hurtFlash=0;
let IS_MOBILE=false;
const MOBILE_ZOOM=1.5;

// ── NAVE ──
const SHIP_W=221,SHIP_H=111;
const ship={x:150,y:270,w:SHIP_W,h:SHIP_H,speed:320,invuln:0};
const shipImg=new Image();let shipReady=false;
shipImg.onload=()=>shipReady=true;
shipImg.src='nave.png';

// ── SPRITESHEET ENEMIGOS 3 ──
const E3_IMG=new Image();let e3Ready=false;
E3_IMG.onload=()=>{e3Ready=true;};
E3_IMG.src='enemigos3.png';
const E3_CELL=530;
const E3_RENDER=115;
function drawE3Enemy(g,type,cx,cy,t){
  if(!e3Ready)return;
  const idx={naveblanca:0,robot:1,murcielago:2,arana:3,ovni:4,tiburon:5,abeja:6,tanque:7,mina:8}[type];
  if(idx===undefined)return;
  const col=idx%3, row=Math.floor(idx/3);
  const sx=col*E3_CELL, sy=row*E3_CELL;
  const bob=Math.sin(t*3+idx)*2;
  g.drawImage(E3_IMG, sx, sy, E3_CELL, E3_CELL, cx-E3_RENDER/2, cy-E3_RENDER/2+bob, E3_RENDER, E3_RENDER);
}

// ── SPRITESHEET ESBIROS ──
const ESB_IMG=new Image();let esbReady=false;
ESB_IMG.onload=()=>{esbReady=true;};
ESB_IMG.src='esbirros_jefe_maquinas.png';
const ESB_CELL_W=795, ESB_CELL_H=562;
const ESB_RENDER=130;
function drawEsbirro(g,type,cx,cy,t){
  if(!esbReady)return;
  const idx={esbirro1:0,esbirro2:1,esbirro3:2,esbirro4:3}[type];
  if(idx===undefined)return;
  const col=idx%2, row=Math.floor(idx/2);
  const sx=col*ESB_CELL_W, sy=row*ESB_CELL_H;
  const bob=Math.sin(t*4+idx)*3;
  g.drawImage(ESB_IMG, sx, sy, ESB_CELL_W, ESB_CELL_H, cx-ESB_RENDER/2, cy-ESB_RENDER/2+bob, ESB_RENDER, ESB_RENDER);
}

// ── FORCE POD PNG ──
const forceImg=new Image();let forceImgReady=false;
forceImg.onload=()=>{forceImgReady=true;};
forceImg.src='force.png';

const FORCE_DIST=440;
const FORCE_SCALE=0.35;
const force={active:false,state:'docked',x:0,y:0,targetX:0,targetY:0,
             w:400,h:300,cooldown:0,shieldFlash:0};

// ── PNGs DE JEFES ──
function makeBossImg(src){const o={img:new Image(),ready:false,aspect:0.7};
 o.img.onload=()=>{o.ready=true;o.aspect=o.img.naturalHeight/o.img.naturalWidth;};
 o.img.src=src; return o;}
const BOSS_IMGS={
  machines:makeBossImg('jefe_maquinas.png'),
  valefor:makeBossImg('jefe_valefor.png'),
  piolin:makeBossImg('jefe_piolin.png'),
  perickko:makeBossImg('jefe_perickko.png')
};

const SAFE_GAP=SHIP_H+60;
const MAX_ENEMY_BULLETS=28;
const MAX_PELLETS=48;
const ENEMY_SCALE=3;
const BOSS_EVERY=10;
const FIRST_WAVE_DELAY=3.0;
const E3_START_WAVE=21;
const MAX_ESBIROS=4;

/* ═══════ SPRITES ENEMIGOS CLÁSICOS ═══════ */
function drawInvader(g,cx,cy,s,t){var q=mk(g,cx,cy,s),G='#3ddc55',g2='#1f9c38',CY='#35e0e8',f=Math.floor(t*4)%2;
 q(-6,-8,2,2,G);q(4,-8,2,2,G);q(-4,-6,2,2,G);q(2,-6,2,2,G);q(-5,-4,10,2,G);
 q(-7,-2,4,2,G);q(-1,-2,2,2,G);q(3,-2,4,2,G);q(-3,-2,2,2,CY);q(1,-2,2,2,CY);
 q(-9,0,18,2,G);q(-9,2,2,2,G);q(-6,2,12,2,g2);q(7,2,2,2,G);
 if(f===0){q(-9,4,2,2,G);q(7,4,2,2,G);q(-4,4,3,2,G);q(1,4,3,2,G);}
 else{q(-9,4,2,4,G);q(7,4,2,4,G);q(-5,4,2,2,G);q(3,4,2,2,G);q(-2,4,4,2,g2);}}
function drawGhost(g,cx,cy,s,t){var q=mk(g,cx,cy,s),R='#e8283c',r2='#a01226',f=Math.floor(t*6)%2;
 ovalD(g,cx,cy-3*s,10*s,7*s,R);q(-10,-3,20,11,R);q(4,-3,6,11,r2);
 for(var i=0;i<4;i++){var up=(i%2===f);q(-10+i*5,8+(up?0:2),5,3-(up?0:1),R);}
 ovalD(g,cx-4*s,cy-3*s,3*s,4*s,'#fff');ovalD(g,cx+4*s,cy-3*s,3*s,4*s,'#fff');
 q(-6,-4,2,3,'#2f9df0');q(2,-4,2,3,'#2f9df0');}
function drawUfo(g,cx,cy,s,t){var q=mk(g,cx,cy,s),bl=Math.floor(t*6)%5,i;
 q(-1,-9,2,2,'#e8283c');
 ovalD(g,cx,cy-4*s,5*s,4*s,'#bfe9ff');ovalD(g,cx,cy-3*s,4*s,3*s,'#7fd8ff');
 ovalD(g,cx,cy+1*s,11*s,4*s,'#c9c4d4');q(-11,1,22,2,'#8b93a8');q(-9,3,18,1,'#5a6178');
 for(i=-2;i<=2;i++){q(i*4-1,0,2,2,(i+2)===bl?'#ffd860':'#e8283c');}
 if(Math.floor(t*2)%2){g.globalAlpha=.22;for(i=0;i<5;i++)q(-3-i,5+i,6+i*2,1,'#7fd8ff');g.globalAlpha=1;}}
function drawPacman(g,cx,cy,s,t){var q=mk(g,cx,cy,s);
 var mouth=2+Math.round(Math.abs(Math.sin(t*9))*3);
 ovalD(g,cx,cy,9*s,9*s,'#ffd860');ovalD(g,cx,cy+3*s,8*s,4*s,'#ffb020');
 for(var y=-mouth;y<mouth;y++){var len=Math.round((mouth-Math.abs(y))*(9/mouth));if(len>0)q(-9,y,len,1,'#0b0e1a');}
 q(1,-6,2,2,'#0b0e1a');}
function drawGalaxian(g,cx,cy,s,t){var q=mk(g,cx,cy,s),R='#e8283c',r2='#a01226',Wc='#f2f0f5',B='#2f9df0',CYc='#7fd8ff',O='#ff8c1a';
 var fl=Math.floor(t*14)%2;
 q(-12,-1,3,2,R);q(-9,-2,3,4,R);
 q(-6,-3,12,6,R);q(-6,1,12,2,r2);q(-6,-1,12,1,Wc);
 q(-4,-5,5,2,CYc);q(-3,-6,3,1,B);
 q(0,-6,8,2,Wc);q(6,-8,4,2,Wc);q(10,-8,2,2,R);
 q(0,4,8,2,Wc);q(6,6,4,2,Wc);q(10,6,2,2,R);
 q(-2,-4,3,1,B);q(-2,3,3,1,B);
 q(6,-1,2+fl,2,O);}
function drawOctopus(g,cx,cy,s,t){var q=mk(g,cx,cy,s),i;
 ovalD(g,cx,cy-2*s,7*s,6*s,'#e04fd0');ovalD(g,cx-2*s,cy-4*s,3*s,2*s,'#ff8ce8');
 q(-4,-3,3,3,'#fff');q(1,-3,3,3,'#fff');q(-3,-2,1,2,'#0b0e1a');q(2,-2,1,2,'#0b0e1a');

 else if(b.state==='dying'){b.targetY=b.y;}

const JOYSTICK_RADIUS=50;
const JOYSTICK_DEADZONE=8;
let joystickActive=false;

function isTouchDevice(){
  return matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
}

function initSkinLayout(){
  IS_MOBILE=isTouchDevice();
  if(IS_MOBILE){

function updateJoystickCenter(){
  const rect=skinJoystick.getBoundingClientRect();
  joystickCenterX=rect.left+rect.width/2;
  joystickCenterY=rect.top+rect.height/2;
}

function bindSkinButton(el, onDown){
  el.addEventListener('touchstart',e=>{
    e.preventDefault(); e.stopPropagation();
    AudioSys.init(); AudioSys.resume();
    onDown();
  },{passive:false});
  el.addEventListener('pointerdown',e=>{
    e.stopPropagation();
    AudioSys.init(); AudioSys.resume();
  });
}

// Eventos del joystick de la skin
skinJoystick.addEventListener('touchstart',e=>{
  e.preventDefault(); e.stopPropagation();
  joystickActive=true;
  const touch=e.touches[0];
  updateJoystick(touch.clientX,touch.clientY);
},{passive:false});
skinJoystick.addEventListener('touchmove',e=>{
  e.preventDefault(); e.stopPropagation();
  if(!joystickActive)return;
  const touch=e.touches[0];
  updateJoystick(touch.clientX,touch.clientY);
},{passive:false});
skinJoystick.addEventListener('touchend',e=>{
  e.preventDefault(); e.stopPropagation();
  joystickActive=false;
  joystickDX=0;joystickDY=0;
  skinJoystickThumb.style.transform='translate(-50%,-50%)';
},{passive:false});

function updateJoystick(clientX,clientY){
  const dx=clientX-joystickCenterX;
  const dy=clientY-joystickCenterY;
  const distance=Math.min(Math.hypot(dx,dy),JOYSTICK_RADIUS);
  const angle=Math.atan2(dy,dx);
  const thumbX=Math.cos(angle)*distance;
  const thumbY=Math.sin(angle)*distance;
  skinJoystickThumb.style.transform=`translate(calc(-50% + ${thumbX}px),calc(-50% + ${thumbY}px))`;
  if(distance<JOYSTICK_DEADZONE){
    joystickDX=0;joystickDY=0;
  }else{
    joystickDX=thumbX/JOYSTICK_RADIUS;
    joystickDY=thumbY/JOYSTICK_RADIUS;
  }
}

function updateForce(dt){
 if(!force.active)return;
 if(force.state==='docked'){

 }else if(force.state==='deploying'){
  force.targetX=ship.x+FORCE_DIST;
  force.targetY=dockY();
  const dx=force.targetX-force.x,dy=force.targetY-force.y;
  const d=Math.hypot(dx,dy);
  if(d<5){force.state='deployed';}
  else{force.x+=dx/d*400*dt;force.y+=dy/d*400*dt;}
 }else if(force.state==='deployed'){
  force.targetX=ship.x+FORCE_DIST;
  force.targetY=dockY();
  const dx=force.targetX-force.x,dy=force.targetY-force.y;
  force.x+=dx*2*dt;force.y+=dy*2*dt;
 }else if(force.state==='returning'){
  force.targetX=dockX();
  force.targetY=dockY();
  const dx=force.targetX-force.x,dy=force.targetY-force.y;
  const d=Math.hypot(dx,dy);
  if(d<5){force.state='docked';}
  else{force.x+=dx/d*400*dt;force.y+=dy/d*400*dt;}
 }

  if(consumed)bullets.splice(i,1);}
 updateEnemies(dt);updateBoss(dt);updateEggs(dt);updateForceItems(dt);updateForce(dt);
 for(let i=enemyBullets.length-1;i>=0;i--){const b=enemyBullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;

 for(let i=bombs.length-1;i>=0;i--){const b=bombs[i];

 for(const p of particles){ctx.globalAlpha=1-p.t/p.life;ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,p.size,p.size);}
 ctx.globalAlpha=1;ctx.restore();
 ctx.textAlign='left';ctx.textBaseline='top';ctx.font='bold 16px monospace';
 ctx.fillStyle='#05060d';ctx.fillText('PUNTOS '+String(score).padStart(6,'0'),16,16);
 ctx.fillStyle='#f2f0f5';ctx.fillText('PUNTOS '+String(score).padStart(6,'0'),14,14);
 for(let i=0;i<lives;i++){if(shipReady)ctx.drawImage(shipImg,14+i*46,40,40,20);else{ctx.fillStyle='#e8283c';ctx.fillRect(14+i*46,44,32,12);}}
 ctx.textAlign='right';ctx.font='bold 14px monospace';ctx.fillStyle='#5a6178';ctx.fillText(String(wave).padStart(2,'0'),W-70,16);
 const prog=(wave%BOSS_EVERY)/BOSS_EVERY;
 ctx.fillStyle='#232a44';ctx.fillRect(W-150,36,80,4);ctx.fillStyle='#e04fd0';ctx.fillRect(W-150,36,80*prog,4);
 if(force.active){ctx.fillStyle='#ff8c1a';ctx.font='bold 11px monospace';ctx.textAlign='right';
  const st=force.state==='deployed'?'FORCE: DESPLEGADO (440px)':force.state==='docked'?'FORCE: ACOPLADO':'FORCE: EN MOVIMIENTO';
  ctx.fillText(st,W-70,50);}
 if(boss&&boss.state!=='enter'){const bw=Math.min(420,W*.6);
  ctx.fillStyle='#05060d';ctx.fillRect(W/2-bw/2-2,14,bw+4,14);ctx.fillStyle='#232a44';ctx.fillRect(W/2-bw/2,16,bw,10);
  ctx.fillStyle=bossColor(boss.type);ctx.fillRect(W/2-bw/2,16,bw*(boss.hp/boss.maxHp),10);}
 if(bossWarnT>0&&boss){ctx.globalAlpha=Math.min(1,bossWarnT);ctx.textAlign='center';
  const wt=bossName(boss.type);ctx.font='bold '+(wt.length>16?20:30)+'px monospace';
  ctx.fillStyle='#05060d';ctx.fillText(wt,W/2+2,H*.28+2);ctx.fillStyle='#ff5a66';ctx.fillText(wt,W/2,H*.28);ctx.globalAlpha=1;}
 for(const p of pops){ctx.globalAlpha=1-p.t/p.life;ctx.textAlign='center';ctx.font='bold 14px monospace';ctx.fillStyle=p.col;ctx.fillText(p.text,p.x,p.y-30*p.t/p.life);}
 ctx.globalAlpha=1;
 if(hurtFlash>0){ctx.fillStyle='rgba(232,40,60,'+(hurtFlash*1.2)+')';ctx.fillRect(0,0,W,H);}
 if(gameState==='over'){ctx.fillStyle='rgba(5,6,13,.72)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='bold 42px monospace';ctx.fillStyle='#05060d';ctx.fillText('FIN DE PARTIDA',W/2+3,H/2-43);ctx.fillStyle='#ff5a66';ctx.fillText('FIN DE PARTIDA',W/2,H/2-46);
  ctx.font='bold 20px monospace';ctx.fillStyle='#f2f0f5';ctx.fillText('PUNTUACIÓN: '+score,W/2,H/2);
  ctx.font='bold 16px monospace';ctx.fillStyle='#ffd860';ctx.fillText('PULSA Z PARA REINTENTAR',W/2,H/2+44);ctx.textBaseline='top';}
 if(hintAlpha>0&&gameState==='play'){ctx.globalAlpha=hintAlpha*.8;ctx.fillStyle='#8b93a8';ctx.font='14px monospace';ctx.textAlign='center';ctx.textBaseline='bottom';
  const controls=IS_MOBILE?'JOYSTIC · A DISPARO · B BOMBA · X FORCE':'FLECHAS/WASD · Z/X/C · M';
  ctx.fillText(controls,W/2,H-40);
  const msg=boss&&boss.type==='machines'?'¡CUIDADO CON LOS ESBIROS!':wave>=E3_START_WAVE?'¡FASE 3: NUEVOS ENEMIGOS!':'OLEADA '+wave+'/'+BOSS_EVERY+' PARA EL JEFE';
  ctx.fillText(msg,W/2,H-22);ctx.globalAlpha=1;}
}
let last=performance.now();
function frame(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 try{update(dt);draw();}catch(err){console.error(err);}
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
